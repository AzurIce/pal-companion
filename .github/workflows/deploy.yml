name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Dioxus base path，例如 /pal-companion/ 或 /"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.base_url || vars.PAL_COMPANION_BASE_URL || format('/{0}/', github.event.repository.name) }}
      DIST_DIR: target/dx/pal-companion/release/web/public
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dioxus-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli

      - name: Test
        run: cargo test --workspace

      - name: Build web bundle
        run: dx build --platform web --release --base-path "${BASE_URL}"

      - name: SPA fallback & bypass Jekyll
        run: |
          cp "${DIST_DIR}/index.html" "${DIST_DIR}/404.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
