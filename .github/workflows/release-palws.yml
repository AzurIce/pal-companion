name: Release Palws dev build

on:
  push:
    branches: [main]
    paths:
      - "crates/palws/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/release-palws.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palws-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: palws-windows

      - name: Derive build identity
        id: build
        shell: pwsh
        run: |
          $date = (git show -s --format=%cs $env:GITHUB_SHA).Trim().Replace("-", "")
          $short = (git rev-parse --short=7 $env:GITHUB_SHA).Trim()
          $id = "$date-$short"
          "id=$id" >> $env:GITHUB_OUTPUT
          "tag=palws-dev-$id" >> $env:GITHUB_OUTPUT
          "archive=palws-dev-$id.zip" >> $env:GITHUB_OUTPUT

      - name: Test Palws
        run: cargo test -p palws

      - name: Build and package
        shell: pwsh
        run: |
          .\crates\palws\scripts\package.ps1 -OutputDirectory artifacts -BuildId "${{ steps.build.outputs.id }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.tag }}
          path: |
            artifacts/${{ steps.build.outputs.archive }}
            artifacts/${{ steps.build.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Create or update prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          $title = "Palws dev ${{ steps.build.outputs.id }}"
          $notes = @"
          Palws development build from commit $env:GITHUB_SHA.

          Download ``$env:RELEASE_ARCHIVE`` and extract its ``Palws`` folder into:
          ``Palworld\Mods\NativeMods\UE4SS\Mods\``

          This prerelease contains the Mod only. The web app is deployed separately.
          "@
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG `
              "artifacts\$env:RELEASE_ARCHIVE" `
              "artifacts\$env:RELEASE_ARCHIVE.sha256" `
              --clobber
          } else {
            gh release create $env:RELEASE_TAG `
              "artifacts\$env:RELEASE_ARCHIVE" `
              "artifacts\$env:RELEASE_ARCHIVE.sha256" `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --prerelease
          }
