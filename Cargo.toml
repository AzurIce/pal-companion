[package]
name = "pal-companion"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/palws"]
resolver = "2"

[features]
gen-data = ["dep:ureq"]

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
# 上游 dioxus-flow（含 RenderNode 改动，commit 7499541）。
# 本地快速调试可临时改为 path = "../dioxus-flow"，push 前必须切回 git 依赖（见 AGENTS.md）。
dioxus-flow = { git = "https://github.com/AzurIce/dioxus-flow", rev = "7499541bfd61f7ad2043359338ae9e1e923caa76" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-storage = "0.3"
# WebSocket 同步（sync 模块）：gloo-net 只取 websocket，futures-util 仅用于读消息流
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "MediaQueryList",
    "Navigator",
    "Clipboard",
    "HtmlTextAreaElement",
    "console",
] }
# 仅 gen_data 工具使用（WASM 构建不引入，避免 getrandom/js 问题）
ureq = { version = "3", optional = true }

[[bin]]
name = "gen_data"
path = "src/bin/gen_data.rs"
required-features = ["gen-data"]

[profile.release]
lto = true
