[package]
name = "palws"
version = "0.1.0"
edition = "2021"

[lib]
name = "palws"
crate-type = ["cdylib"]

[dependencies]
# vendored: compiles stock Lua 5.4 from source into THIS dll (UE4SS.dll exports
# no lua_* symbols); same Lua 5.4.x ABI as UE4SS's embedded interpreter.
mlua-sys = { version = "0.6", features = ["lua54", "vendored"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
